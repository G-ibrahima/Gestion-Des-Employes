{% extends "employe/base.html" %}


    {% block content %} 
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            {{form.nom}}
            {{form.email}}
            {{form.poste}}
            {{form.salaire}}
            <div>
                <button type= "submit" class="btn btn-primary">Enregistrer</button>
                <a href="{%url 'list_employes' %}" class="btn btn-primary">Retounez vers la liste</a>
            </div>
        </form>
    {% endblock %}
